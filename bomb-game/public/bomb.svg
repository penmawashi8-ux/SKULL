<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1a0808"/>
      <stop offset="100%" stop-color="#080303"/>
    </radialGradient>
    <radialGradient id="bombBody" gradientUnits="userSpaceOnUse" cx="46" cy="52" r="28">
      <stop offset="0%"   stop-color="#d0d0d0"/>
      <stop offset="20%"  stop-color="#888888"/>
      <stop offset="55%"  stop-color="#3c3c3c"/>
      <stop offset="100%" stop-color="#0e0e0e"/>
    </radialGradient>
    <radialGradient id="sparkCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#fff9c0"/>
      <stop offset="40%"  stop-color="#ffcc00"/>
      <stop offset="100%" stop-color="#ff6600" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bodyShading" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.9"/>
    </filter>
    <clipPath id="clip">
      <circle cx="60" cy="60" r="50"/>
    </clipPath>
  </defs>

  <circle cx="60" cy="60" r="58" fill="url(#bg)"/>
  <circle cx="60" cy="60" r="57" fill="none" stroke="#ef4444" stroke-width="5" opacity="0.14"/>
  <circle cx="60" cy="60" r="56" fill="none" stroke="#ef4444" stroke-width="1.4" opacity="0.80"/>
  <circle cx="60" cy="60" r="53" fill="none" stroke="#ef4444" stroke-width="0.6" opacity="0.30"/>

  <g clip-path="url(#clip)">

    <!-- Bomb body -->
    <circle cx="58" cy="68" r="27" fill="url(#bombBody)" filter="url(#bodyShading)"/>
    <!-- Visible edge stroke to separate from background -->
    <circle cx="58" cy="68" r="27" fill="none" stroke="#888" stroke-width="1.2" opacity="0.5"/>

    <!-- Primary highlight -->
    <ellipse cx="47" cy="55" rx="12" ry="8" fill="white" opacity="0.35"
             transform="rotate(-35 47 55)"/>
    <!-- Secondary highlight -->
    <ellipse cx="45" cy="53" rx="5.5" ry="3.5" fill="white" opacity="0.25"
             transform="rotate(-35 45 53)"/>
    <!-- Rim light -->
    <ellipse cx="68" cy="82" rx="10" ry="3.5" fill="white" opacity="0.08"/>

    <!-- Fuse connector cap -->
    <rect x="54.5" y="39" width="8" height="7" rx="2.5" fill="#444"/>
    <rect x="55.5" y="39.5" width="6" height="3" rx="1.5" fill="#777" opacity="0.6"/>

    <!-- Fuse wire -->
    <path d="M 58.5 39 C 56 30, 66 24, 68 15"
          fill="none" stroke="#7a5010" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 58.5 39 C 56 30, 66 24, 68 15"
          fill="none" stroke="#d4a030" stroke-width="1.2" stroke-linecap="round" opacity="0.95"/>

    <!-- Spark glow -->
    <circle cx="68" cy="14" r="8" fill="url(#sparkCore)" opacity="0.9" filter="url(#softGlow)"/>

    <!-- Spark rays -->
    <g filter="url(#glow)">
      <line x1="68" y1="6"  x2="68" y2="10" stroke="#ffee80" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="68" y1="18" x2="68" y2="22" stroke="#ffcc30" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="60" y1="14" x2="64" y2="14" stroke="#ffee80" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="72" y1="14" x2="76" y2="14" stroke="#ffee80" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="62.5" y1="8.5"  x2="64.8" y2="10.8" stroke="#ffcc30" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="71.2" y1="17.2" x2="73.5" y2="19.5" stroke="#ffcc30" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="62.5" y1="19.5" x2="64.8" y2="17.2" stroke="#ff9900" stroke-width="1.4" stroke-linecap="round"/>
      <line x1="71.2" y1="10.8" x2="73.5" y2="8.5"  stroke="#ff9900" stroke-width="1.4" stroke-linecap="round"/>
      <circle cx="68" cy="14" r="2.8" fill="#fff9a0"/>
      <circle cx="68" cy="14" r="1.5" fill="white"/>
    </g>

  </g>

  <circle cx="60" cy="60" r="50" fill="none" stroke="black" stroke-width="6" opacity="0.35"/>
</svg>
