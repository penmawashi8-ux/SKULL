<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#0a1408"/>
      <stop offset="100%" stop-color="#020503"/>
    </radialGradient>
    <radialGradient id="apple" gradientUnits="userSpaceOnUse" cx="44" cy="46" r="32">
      <stop offset="0%"   stop-color="#ff9090"/>
      <stop offset="18%"  stop-color="#ff2020"/>
      <stop offset="55%"  stop-color="#bb0000"/>
      <stop offset="100%" stop-color="#4a0000"/>
    </radialGradient>
    <radialGradient id="leaf" gradientUnits="userSpaceOnUse" cx="66" cy="32" r="12">
      <stop offset="0%"   stop-color="#6ee040"/>
      <stop offset="100%" stop-color="#1a6008"/>
    </radialGradient>
    <filter id="sh"><feDropShadow dx="1" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.65"/></filter>
    <clipPath id="cl"><circle cx="60" cy="60" r="50"/></clipPath>
  </defs>

  <circle cx="60" cy="60" r="58" fill="url(#bg)"/>
  <circle cx="60" cy="60" r="57" fill="none" stroke="#22c55e" stroke-width="5" opacity="0.12"/>
  <circle cx="60" cy="60" r="56" fill="none" stroke="#22c55e" stroke-width="1.2" opacity="0.75"/>
  <circle cx="60" cy="60" r="53" fill="none" stroke="#22c55e" stroke-width="0.5" opacity="0.25"/>

  <g clip-path="url(#cl)">
    <path d="
      M 60 36
      C 50 34, 32 38, 30 54
      C 28 68, 34 82, 44 88
      C 50 92, 56 90, 60 88
      C 64 90, 70 92, 76 88
      C 86 82, 92 68, 90 54
      C 88 38, 70 34, 60 36
      Z
    " fill="url(#apple)" filter="url(#sh)"/>

    <ellipse cx="60" cy="37" rx="5" ry="4" fill="#3a0000" opacity="0.5"/>

    <ellipse cx="43" cy="52" rx="10" ry="14" fill="white" opacity="0.20"
             transform="rotate(-25 43 52)"/>
    <ellipse cx="41" cy="50" rx="4.5" ry="8" fill="white" opacity="0.15"
             transform="rotate(-25 41 50)"/>

    <path d="M 60 36 C 60 30, 62 24, 65 20"
          fill="none" stroke="#4a2808" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 60 36 C 60 30, 62 24, 65 20"
          fill="none" stroke="#9a6028" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

    <path d="M 64 26 C 70 20, 80 20, 78 30 C 76 36, 68 36, 64 26 Z"
          fill="url(#leaf)" filter="url(#sh)"/>
    <path d="M 64 26 C 68 26, 74 26, 74 30" fill="none" stroke="#1a4808" stroke-width="1" opacity="0.5"/>
    <ellipse cx="72" cy="24" rx="4" ry="2.5" fill="white" opacity="0.15" transform="rotate(-30 72 24)"/>
  </g>

  <circle cx="60" cy="60" r="50" fill="none" stroke="black" stroke-width="6" opacity="0.35"/>
