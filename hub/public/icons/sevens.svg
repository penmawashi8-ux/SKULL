<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="sv-bg" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#041d2c"/>
    </radialGradient>
    <linearGradient id="sv-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dde4f0"/>
    </linearGradient>
    <filter id="sv-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="sv-clip">
      <circle cx="60" cy="60" r="50"/>
    </clipPath>
  </defs>

  <circle cx="60" cy="60" r="50" fill="url(#sv-bg)"/>
  <g clip-path="url(#sv-clip)">
    <!-- 横につながるカード列（6-7-8） -->
    <g filter="url(#sv-shadow)">
      <rect x="14" y="42" width="26" height="38" rx="5" fill="url(#sv-card)" stroke="#94a3b8" stroke-width="1"/>
      <rect x="47" y="38" width="26" height="38" rx="5" fill="url(#sv-card)" stroke="#38bdf8" stroke-width="2"/>
      <rect x="80" y="42" width="26" height="38" rx="5" fill="url(#sv-card)" stroke="#94a3b8" stroke-width="1"/>
    </g>
    <text x="27" y="59" font-size="14" font-weight="900" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif">6</text>
    <text x="27" y="73" font-size="11" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif">♠</text>
    <text x="60" y="55" font-size="14" font-weight="900" text-anchor="middle" fill="#dc2626" font-family="Arial, sans-serif">7</text>
    <text x="60" y="69" font-size="11" text-anchor="middle" fill="#dc2626" font-family="Arial, sans-serif">♥</text>
    <text x="93" y="59" font-size="14" font-weight="900" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif">8</text>
    <text x="93" y="73" font-size="11" text-anchor="middle" fill="#1e293b" font-family="Arial, sans-serif">♦</text>
    <!-- おかわりエイトのプレゼント -->
    <text x="88" y="30" font-size="16" text-anchor="middle" filter="url(#sv-shadow)">🎁</text>
    <!-- 矢印 -->
    <g stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
      <line x1="30" y1="94" x2="90" y2="94"/>
      <path d="M84 89 L90 94 L84 99" fill="none"/>
      <path d="M36 89 L30 94 L36 99" fill="none"/>
    </g>
  </g>
  <circle cx="60" cy="60" r="49" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.55"/>
</svg>
