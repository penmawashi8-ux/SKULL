<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="gm-bg" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#8a6430"/>
      <stop offset="100%" stop-color="#3d2b12"/>
    </radialGradient>
    <radialGradient id="gm-black" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#555"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <radialGradient id="gm-white" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c3cbd9"/>
    </radialGradient>
    <filter id="gm-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="gm-clip">
      <circle cx="60" cy="60" r="50"/>
    </clipPath>
  </defs>

  <circle cx="60" cy="60" r="50" fill="url(#gm-bg)"/>
  <g clip-path="url(#gm-clip)">
    <!-- 盤面の線 -->
    <g stroke="#2c1e0a" stroke-width="1.6" opacity="0.7">
      <line x1="10" y1="30" x2="110" y2="30"/>
      <line x1="10" y1="50" x2="110" y2="50"/>
      <line x1="10" y1="70" x2="110" y2="70"/>
      <line x1="10" y1="90" x2="110" y2="90"/>
      <line x1="30" y1="10" x2="30" y2="110"/>
      <line x1="50" y1="10" x2="50" y2="110"/>
      <line x1="70" y1="10" x2="70" y2="110"/>
      <line x1="90" y1="10" x2="90" y2="110"/>
    </g>
    <!-- 斜めに5連の黒石 -->
    <g filter="url(#gm-shadow)">
      <circle cx="30" cy="90" r="9" fill="url(#gm-black)"/>
      <circle cx="45" cy="75" r="9" fill="url(#gm-black)"/>
      <circle cx="60" cy="60" r="9" fill="url(#gm-black)"/>
      <circle cx="75" cy="45" r="9" fill="url(#gm-black)"/>
      <circle cx="90" cy="30" r="9" fill="url(#gm-black)"/>
      <circle cx="50" cy="30" r="9" fill="url(#gm-white)"/>
      <circle cx="90" cy="70" r="9" fill="url(#gm-white)"/>
    </g>
    <!-- クラッシュマス -->
    <text x="32" y="45" font-size="16" text-anchor="middle" filter="url(#gm-shadow)">💥</text>
  </g>
  <circle cx="60" cy="60" r="49" fill="none" stroke="#fbbf24" stroke-width="2" opacity="0.55"/>
</svg>
