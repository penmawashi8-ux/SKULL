<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#080f1e"/><stop offset="100%" stop-color="#020408"/>
    </radialGradient>
    <radialGradient id="card" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#c8a030"/><stop offset="40%" stop-color="#7a6010"/><stop offset="100%" stop-color="#1e1808"/>
    </radialGradient>
    <linearGradient id="cardFace" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#d4b040"/><stop offset="100%" stop-color="#6a4e08"/>
    </linearGradient>
    <filter id="sh"><feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.65"/></filter>
    <clipPath id="cl"><circle cx="60" cy="60" r="50"/></clipPath>
  </defs>
  <circle cx="60" cy="60" r="58" fill="url(#bg)"/>
  <circle cx="60" cy="60" r="57" fill="none" stroke="#3b82f6" stroke-width="5" opacity="0.12"/>
  <circle cx="60" cy="60" r="56" fill="none" stroke="#3b82f6" stroke-width="1.2" opacity="0.75"/>
  <circle cx="60" cy="60" r="53" fill="none" stroke="#3b82f6" stroke-width="0.5" opacity="0.25"/>
  <g clip-path="url(#cl)">
    <!-- Card back (slightly rotated) -->
    <rect x="34" y="22" width="44" height="62" rx="5" fill="url(#card)" transform="rotate(-8 56 53)" filter="url(#sh)"/>
    <!-- Card face (slightly rotated the other way) -->
    <rect x="40" y="26" width="44" height="62" rx="5" fill="url(#cardFace)" transform="rotate(5 62 57)" filter="url(#sh)"/>
    <!-- Card face inner border -->
    <rect x="43" y="29" width="38" height="56" rx="3.5" fill="none" stroke="#1e1808" stroke-width="1" transform="rotate(5 62 57)" opacity="0.5"/>
    <!-- Spade symbol (center) -->
    <g transform="translate(62 60) rotate(5)">
      <!-- Spade head (heart shape inverted) -->
      <path d="M 0 -14 C 0 -14, -11 -22, -11 -13 C -11 -6, -4 -2, 0 4 C 4 -2, 11 -6, 11 -13 C 11 -22, 0 -14, 0 -14 Z"
            fill="#1e1808" opacity="0.85"/>
      <!-- Spade stem -->
      <path d="M 0 4 C -2 8, -5 10, -7 14 L 7 14 C 5 10, 2 8, 0 4 Z"
            fill="#1e1808" opacity="0.85"/>
    </g>
    <!-- Corner J marks -->
    <text x="47" y="40" font-family="serif" font-size="9" font-weight="bold" fill="#1e1808" opacity="0.7" transform="rotate(5 47 40)">J</text>
    <text x="74" y="78" font-family="serif" font-size="9" font-weight="bold" fill="#1e1808" opacity="0.7" transform="rotate(185 74 78)">J</text>
    <!-- Card face highlight -->
    <rect x="43" y="29" width="18" height="28" rx="3" fill="white" opacity="0.06" transform="rotate(5 52 43)"/>
  </g>
  <circle cx="60" cy="60" r="50" fill="none" stroke="black" stroke-width="6" opacity="0.35"/>
</svg>
