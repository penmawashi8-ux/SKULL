<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#160f28"/><stop offset="100%" stop-color="#04020a"/>
    </radialGradient>
    <radialGradient id="brain" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#c8920a"/><stop offset="40%" stop-color="#7a560a"/><stop offset="100%" stop-color="#1e1505"/>
    </radialGradient>
    <filter id="sh"><feDropShadow dx="1" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.65"/></filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cl"><circle cx="60" cy="60" r="50"/></clipPath>
  </defs>
  <circle cx="60" cy="60" r="58" fill="url(#bg)"/>
  <circle cx="60" cy="60" r="57" fill="none" stroke="#7c3aed" stroke-width="5" opacity="0.12"/>
  <circle cx="60" cy="60" r="56" fill="none" stroke="#7c3aed" stroke-width="1.2" opacity="0.75"/>
  <circle cx="60" cy="60" r="53" fill="none" stroke="#7c3aed" stroke-width="0.5" opacity="0.25"/>
  <g clip-path="url(#cl)">
    <!-- Brain stem base -->
    <ellipse cx="60" cy="82" rx="10" ry="5" fill="url(#brain)" opacity="0.7" filter="url(#sh)"/>

    <!-- Left hemisphere -->
    <path d="
      M 60 36
      C 54 34, 42 34, 36 42
      C 30 50, 30 62, 34 70
      C 36 76, 42 80, 48 80
      C 54 80, 58 78, 60 76
      Z
    " fill="url(#brain)" filter="url(#sh)"/>

    <!-- Right hemisphere -->
    <path d="
      M 60 36
      C 66 34, 78 34, 84 42
      C 90 50, 90 62, 86 70
      C 84 76, 78 80, 72 80
      C 66 80, 62 78, 60 76
      Z
    " fill="url(#brain)" filter="url(#sh)"/>

    <!-- Center divide -->
    <line x1="60" y1="36" x2="60" y2="76" stroke="#120a02" stroke-width="2" opacity="0.5"/>

    <!-- Brain folds - left hemisphere -->
    <path d="M 42 44 C 38 50, 36 56, 38 62" fill="none" stroke="#120a02" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <path d="M 36 55 C 38 52, 42 50, 44 54 C 46 58, 44 64, 40 66" fill="none" stroke="#120a02" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    <path d="M 44 44 C 46 50, 44 56, 42 62" fill="none" stroke="#120a02" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
    <path d="M 50 40 C 50 48, 48 56, 50 64" fill="none" stroke="#120a02" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
    <path d="M 38 66 C 40 72, 44 76, 50 78" fill="none" stroke="#120a02" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

    <!-- Brain folds - right hemisphere -->
    <path d="M 78 44 C 82 50, 84 56, 82 62" fill="none" stroke="#120a02" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <path d="M 84 55 C 82 52, 78 50, 76 54 C 74 58, 76 64, 80 66" fill="none" stroke="#120a02" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    <path d="M 76 44 C 74 50, 76 56, 78 62" fill="none" stroke="#120a02" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
    <path d="M 70 40 C 70 48, 72 56, 70 64" fill="none" stroke="#120a02" stroke-width="1.5" stroke-linecap="round" opacity="0.35"/>
    <path d="M 82 66 C 80 72, 76 76, 70 78" fill="none" stroke="#120a02" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>

    <!-- Highlight -->
    <ellipse cx="46" cy="44" rx="6" ry="4" fill="white" opacity="0.09" transform="rotate(-30 46 44)"/>
    <ellipse cx="74" cy="44" rx="6" ry="4" fill="white" opacity="0.09" transform="rotate(30 74 44)"/>

    <!-- Neural glow dots -->
    <g filter="url(#glow)">
      <circle cx="42" cy="56" r="1.5" fill="#7c3aed" opacity="0.6"/>
      <circle cx="50" cy="48" r="1.5" fill="#7c3aed" opacity="0.5"/>
      <circle cx="78" cy="56" r="1.5" fill="#7c3aed" opacity="0.6"/>
      <circle cx="70" cy="48" r="1.5" fill="#7c3aed" opacity="0.5"/>
      <circle cx="60" cy="52" r="2" fill="#7c3aed" opacity="0.4"/>
    </g>
  </g>
  <circle cx="60" cy="60" r="50" fill="none" stroke="black" stroke-width="6" opacity="0.35"/>
</svg>
