<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1a0800"/><stop offset="100%" stop-color="#060200"/>
    </radialGradient>
    <radialGradient id="horse" cx="30%" cy="25%" r="70%">
      <stop offset="0%" stop-color="#c8920a"/><stop offset="40%" stop-color="#7a560a"/><stop offset="100%" stop-color="#1e1505"/>
    </radialGradient>
    <radialGradient id="jockey" cx="35%" cy="25%" r="65%">
      <stop offset="0%" stop-color="#e8c040"/><stop offset="100%" stop-color="#5a3808"/>
    </radialGradient>
    <filter id="sh"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/></filter>
    <filter id="speed" x="-20%" y="-20%" width="160%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="cl"><circle cx="60" cy="60" r="50"/></clipPath>
  </defs>
  <circle cx="60" cy="60" r="58" fill="url(#bg)"/>
  <circle cx="60" cy="60" r="57" fill="none" stroke="#ea580c" stroke-width="5" opacity="0.12"/>
  <circle cx="60" cy="60" r="56" fill="none" stroke="#ea580c" stroke-width="1.2" opacity="0.75"/>
  <circle cx="60" cy="60" r="53" fill="none" stroke="#ea580c" stroke-width="0.5" opacity="0.25"/>
  <g clip-path="url(#cl)">
    <!-- Speed lines -->
    <g opacity="0.18" filter="url(#speed)">
      <line x1="18" y1="58" x2="42" y2="58" stroke="#ea580c" stroke-width="2" stroke-linecap="round"/>
      <line x1="14" y1="65" x2="38" y2="65" stroke="#ea580c" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="18" y1="72" x2="40" y2="72" stroke="#ea580c" stroke-width="1" stroke-linecap="round"/>
    </g>

    <!-- Horse body (elongated, galloping, tilted forward) -->
    <ellipse cx="64" cy="68" rx="28" ry="14" fill="url(#horse)" transform="rotate(-12 64 68)" filter="url(#sh)"/>

    <!-- Horse neck -->
    <path d="M 56 56 C 58 48, 62 42, 66 40 C 70 38, 74 40, 74 44 C 74 48, 70 52, 66 54 C 62 56, 58 56, 56 56 Z"
          fill="url(#horse)" filter="url(#sh)"/>

    <!-- Horse head -->
    <ellipse cx="73" cy="38" rx="10" ry="7" fill="url(#horse)" transform="rotate(20 73 38)" filter="url(#sh)"/>

    <!-- Ear -->
    <polygon points="76,30 80,24 82,31" fill="url(#horse)"/>

    <!-- Eye -->
    <circle cx="76" cy="36" r="2.5" fill="#120804"/>
    <circle cx="77" cy="35" r="1" fill="white" opacity="0.8"/>

    <!-- Nostril -->
    <ellipse cx="80" cy="42" rx="2" ry="1.5" fill="#120804" opacity="0.8" transform="rotate(20 80 42)"/>

    <!-- Mane -->
    <path d="M 66 40 C 62 42, 58 46, 56 52" fill="none" stroke="#5a3806" stroke-width="4" stroke-linecap="round"/>
    <path d="M 66 40 C 62 42, 58 46, 56 52" fill="none" stroke="#c8920a" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>

    <!-- Front legs (outstretched forward) -->
    <path d="M 74 74 C 76 78, 80 82, 86 84" fill="none" stroke="#7a560a" stroke-width="5" stroke-linecap="round" filter="url(#sh)"/>
    <path d="M 68 76 C 72 82, 78 88, 82 92" fill="none" stroke="#7a560a" stroke-width="4.5" stroke-linecap="round" filter="url(#sh)"/>

    <!-- Back legs (outstretched back) -->
    <path d="M 48 76 C 44 80, 38 84, 34 86" fill="none" stroke="#7a560a" stroke-width="5" stroke-linecap="round" filter="url(#sh)"/>
    <path d="M 54 76 C 50 82, 44 88, 40 92" fill="none" stroke="#7a560a" stroke-width="4.5" stroke-linecap="round" filter="url(#sh)"/>

    <!-- Tail -->
    <path d="M 42 66 C 36 62, 28 60, 24 56" fill="none" stroke="#7a560a" stroke-width="4" stroke-linecap="round"/>
    <path d="M 42 66 C 36 64, 26 64, 22 62" fill="none" stroke="#7a560a" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Jockey body -->
    <ellipse cx="60" cy="52" rx="8" ry="6" fill="url(#jockey)" transform="rotate(-15 60 52)" filter="url(#sh)"/>
    <!-- Jockey head -->
    <circle cx="57" cy="45" r="5.5" fill="url(#jockey)" filter="url(#sh)"/>
    <!-- Jockey helmet -->
    <path d="M 52 44 C 52 38, 62 38, 62 44" fill="#2a1808" opacity="0.8"/>
    <!-- Jockey highlight -->
    <ellipse cx="55" cy="43" rx="3" ry="2" fill="white" opacity="0.1" transform="rotate(-20 55 43)"/>
  </g>
  <circle cx="60" cy="60" r="50" fill="none" stroke="black" stroke-width="6" opacity="0.35"/>
</svg>
