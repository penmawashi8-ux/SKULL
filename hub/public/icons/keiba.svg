<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1e1400"/><stop offset="100%" stop-color="#060400"/>
    </radialGradient>
    <!-- gradient anchored to userSpace so it hits the actual shapes -->
    <radialGradient id="g" gradientUnits="userSpaceOnUse" cx="52" cy="42" r="38">
      <stop offset="0%"   stop-color="#f5e080"/>
      <stop offset="30%"  stop-color="#d4a028"/>
      <stop offset="70%"  stop-color="#8a5c10"/>
      <stop offset="100%" stop-color="#2a1604"/>
    </radialGradient>
    <radialGradient id="gn" gradientUnits="userSpaceOnUse" cx="52" cy="42" r="38">
      <stop offset="0%"   stop-color="#e8cc60"/>
      <stop offset="50%"  stop-color="#a07820"/>
      <stop offset="100%" stop-color="#3a2208"/>
    </radialGradient>
    <filter id="sh"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.7"/></filter>
    <clipPath id="cl"><circle cx="60" cy="60" r="50"/></clipPath>
  </defs>

  <circle cx="60" cy="60" r="58" fill="url(#bg)"/>
  <circle cx="60" cy="60" r="57" fill="none" stroke="#d97706" stroke-width="5" opacity="0.12"/>
  <circle cx="60" cy="60" r="56" fill="none" stroke="#d97706" stroke-width="1.2" opacity="0.75"/>
  <circle cx="60" cy="60" r="53" fill="none" stroke="#d97706" stroke-width="0.5" opacity="0.25"/>

  <g clip-path="url(#cl)">

    <!-- Neck (lower-left area) -->
    <path d="M 24 88 C 28 76, 34 64, 42 56 C 46 52, 50 50, 54 50
             L 50 88 Z"
          fill="url(#g)" filter="url(#sh)"/>

    <!-- Head (large bold oval, tilted) -->
    <ellipse cx="58" cy="46" rx="24" ry="17"
             fill="url(#g)" transform="rotate(-10 58 46)" filter="url(#sh)"/>

    <!-- Muzzle (forward extension) -->
    <ellipse cx="78" cy="56" rx="13" ry="9"
             fill="url(#gn)" filter="url(#sh)"/>

    <!-- Ear -->
    <polygon points="46,30 40,16 52,28" fill="url(#g)" filter="url(#sh)"/>
    <polygon points="46,29 42,20 50,28" fill="#2e1604" opacity="0.55"/>

    <!-- Mane (bold strokes along back of neck) -->
    <path d="M 48 32 C 44 40, 40 50, 38 60 C 36 68, 34 76, 32 84"
          fill="none" stroke="#6a3e08" stroke-width="6" stroke-linecap="round"/>
    <path d="M 48 32 C 44 40, 40 50, 38 60 C 36 68, 34 76, 32 84"
          fill="none" stroke="#d4a028" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>

    <!-- Eye (large, visible) -->
    <circle cx="62" cy="42" r="6" fill="#120804"/>
    <circle cx="64" cy="40" r="2.2" fill="white" opacity="0.9"/>
    <circle cx="62" cy="42" r="3.5" fill="#0a0402"/>

    <!-- Nostril -->
    <ellipse cx="84" cy="58" rx="4" ry="3" fill="#120804" opacity="0.85"
             transform="rotate(15 84 58)"/>

    <!-- Head highlight -->
    <ellipse cx="48" cy="38" rx="9" ry="6" fill="white" opacity="0.1"
             transform="rotate(-20 48 38)"/>

  </g>

  <circle cx="60" cy="60" r="50" fill="none" stroke="black" stroke-width="6" opacity="0.35"/>
</svg>
