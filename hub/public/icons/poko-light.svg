<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="pl-bg" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#2a1800"/>
      <stop offset="100%" stop-color="#0a0700"/>
    </radialGradient>
    <radialGradient id="pl-bulb" cx="38%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fffde0"/>
      <stop offset="30%" stop-color="#fde68a"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </radialGradient>
    <radialGradient id="pl-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef9c3" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="pl-softglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pl-glow2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="pl-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <clipPath id="pl-clip">
      <circle cx="60" cy="60" r="50"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <circle cx="60" cy="60" r="58" fill="url(#pl-bg)"/>

  <!-- Outer ring -->
  <circle cx="60" cy="60" r="57" fill="none" stroke="#f59e0b" stroke-width="5" opacity="0.12"/>
  <circle cx="60" cy="60" r="56" fill="none" stroke="#f59e0b" stroke-width="1.2" opacity="0.75"/>
  <circle cx="60" cy="60" r="53" fill="none" stroke="#fbbf24" stroke-width="0.6" opacity="0.25"/>

  <g clip-path="url(#pl-clip)">

    <!-- Ambient glow behind bulb -->
    <circle cx="60" cy="52" r="30" fill="url(#pl-glow)" filter="url(#pl-softglow)" opacity="0.85"/>

    <!-- Bulb body -->
    <path d="M44 58 Q44 38 60 33 Q76 38 76 58 Q76 68 70 73 L50 73 Q44 68 44 58Z"
          fill="url(#pl-bulb)" filter="url(#pl-shadow)"/>

    <!-- Bulb highlight -->
    <ellipse cx="53" cy="46" rx="5" ry="7" fill="white" opacity="0.22" transform="rotate(-20 53 46)"/>
    <ellipse cx="51" cy="44" rx="2.5" ry="4" fill="white" opacity="0.15" transform="rotate(-20 51 44)"/>

    <!-- Filament -->
    <g filter="url(#pl-glow2)" opacity="0.9">
      <path d="M54 68 L54 62 Q57 58 60 62 Q63 58 66 62 L66 68"
            fill="none" stroke="#fff9c0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Base neck -->
    <rect x="52" y="73" width="16" height="5" rx="1.5" fill="#7c4a00"/>
    <rect x="52" y="73" width="16" height="2" rx="1.5" fill="#a16207" opacity="0.6"/>

    <!-- Base lines (screw threads) -->
    <rect x="51" y="79" width="18" height="4" rx="1.5" fill="#6b3a00"/>
    <rect x="51" y="84" width="18" height="4" rx="1.5" fill="#5c3200"/>
    <rect x="52" y="89" width="16" height="4" rx="1.5" fill="#4a2800"/>

    <!-- Base cap bottom -->
    <rect x="53" y="93" width="14" height="3" rx="1.5" fill="#3d2000"/>

    <!-- Ray lines emanating from bulb -->
    <g filter="url(#pl-glow2)" opacity="0.8">
      <!-- top -->
      <line x1="60" y1="20" x2="60" y2="26" stroke="#fef08a" stroke-width="2" stroke-linecap="round"/>
      <!-- top-right -->
      <line x1="73" y1="24" x2="70" y2="29" stroke="#fde68a" stroke-width="1.8" stroke-linecap="round"/>
      <!-- right -->
      <line x1="82" y1="40" x2="77" y2="43" stroke="#fde68a" stroke-width="1.8" stroke-linecap="round"/>
      <!-- top-left -->
      <line x1="47" y1="24" x2="50" y2="29" stroke="#fde68a" stroke-width="1.8" stroke-linecap="round"/>
      <!-- left -->
      <line x1="38" y1="40" x2="43" y2="43" stroke="#fde68a" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- Sparkle dots -->
    <g filter="url(#pl-glow2)">
      <circle cx="60" cy="22" r="1.5" fill="#fffde0"/>
      <circle cx="75" cy="26" r="1.2" fill="#fde68a"/>
      <circle cx="45" cy="26" r="1.2" fill="#fde68a"/>
      <circle cx="84" cy="42" r="1.2" fill="#fbbf24"/>
      <circle cx="36" cy="42" r="1.2" fill="#fbbf24"/>
    </g>

  </g>

  <!-- Top edge inner shadow -->
  <circle cx="60" cy="60" r="50" fill="none" stroke="black" stroke-width="6" opacity="0.3"/>
</svg>
