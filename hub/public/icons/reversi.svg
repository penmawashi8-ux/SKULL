<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="rv-bg" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#052012"/>
    </radialGradient>
    <radialGradient id="rv-black" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#555"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <radialGradient id="rv-white" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c3cbd9"/>
    </radialGradient>
    <filter id="rv-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="rv-clip">
      <circle cx="60" cy="60" r="50"/>
    </clipPath>
  </defs>

  <circle cx="60" cy="60" r="50" fill="url(#rv-bg)"/>
  <g clip-path="url(#rv-clip)">
    <!-- 盤面のマス目 -->
    <g stroke="#0a2818" stroke-width="2.5" opacity="0.85">
      <line x1="18" y1="43" x2="102" y2="43"/>
      <line x1="18" y1="77" x2="102" y2="77"/>
      <line x1="43" y1="18" x2="43" y2="102"/>
      <line x1="77" y1="18" x2="77" y2="102"/>
    </g>
    <!-- 石 -->
    <circle cx="43" cy="43" r="13" fill="url(#rv-black)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" filter="url(#rv-shadow)"/>
    <circle cx="77" cy="43" r="13" fill="url(#rv-white)" stroke="rgba(0,0,0,0.25)" stroke-width="1.5" filter="url(#rv-shadow)"/>
    <circle cx="43" cy="77" r="13" fill="url(#rv-white)" stroke="rgba(0,0,0,0.25)" stroke-width="1.5" filter="url(#rv-shadow)"/>
    <!-- おかわりマスの星 -->
    <text x="77" y="85" font-size="20" text-anchor="middle" filter="url(#rv-shadow)">⭐</text>
  </g>
  <circle cx="60" cy="60" r="49" fill="none" stroke="#a3e635" stroke-width="2" opacity="0.5"/>
</svg>
