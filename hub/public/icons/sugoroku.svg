<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="sg-bg" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#022c22"/>
    </radialGradient>
    <linearGradient id="sg-dice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d7dde8"/>
    </linearGradient>
    <filter id="sg-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <clipPath id="sg-clip">
      <circle cx="60" cy="60" r="50"/>
    </clipPath>
  </defs>

  <circle cx="60" cy="60" r="50" fill="url(#sg-bg)"/>
  <g clip-path="url(#sg-clip)">
    <!-- すごろくのマス道 -->
    <g filter="url(#sg-shadow)">
      <rect x="14" y="76" width="22" height="18" rx="5" fill="#1b1f3e" stroke="#34d399" stroke-width="1.5"/>
      <rect x="40" y="76" width="22" height="18" rx="5" fill="#1b1f3e" stroke="#34d399" stroke-width="1.5"/>
      <rect x="66" y="76" width="22" height="18" rx="5" fill="#1b1f3e" stroke="#34d399" stroke-width="1.5"/>
      <rect x="66" y="52" width="22" height="18" rx="5" fill="#1b1f3e" stroke="#34d399" stroke-width="1.5"/>
      <rect x="92" y="52" width="22" height="18" rx="5" fill="#713f12" stroke="#fbbf24" stroke-width="1.5"/>
    </g>
    <text x="103" y="65" font-size="11" text-anchor="middle">🏁</text>
    <!-- コマ -->
    <circle cx="25" cy="80" r="6" fill="#f87171" stroke="#fff" stroke-width="1.5" filter="url(#sg-shadow)"/>
    <circle cx="51" cy="80" r="6" fill="#60a5fa" stroke="#fff" stroke-width="1.5" filter="url(#sg-shadow)"/>
    <!-- サイコロ -->
    <g transform="rotate(-12 52 38)" filter="url(#sg-shadow)">
      <rect x="34" y="20" width="36" height="36" rx="8" fill="url(#sg-dice)"/>
      <circle cx="44" cy="30" r="3.4" fill="#1e293b"/>
      <circle cx="60" cy="38" r="3.4" fill="#dc2626"/>
      <circle cx="44" cy="46" r="3.4" fill="#1e293b"/>
      <circle cx="60" cy="30" r="3.4" fill="#1e293b"/>
      <circle cx="44" cy="38" r="3.4" fill="#1e293b"/>
      <circle cx="60" cy="46" r="3.4" fill="#1e293b"/>
    </g>
    <!-- ドッスン -->
    <text x="88" y="30" font-size="16" text-anchor="middle" filter="url(#sg-shadow)">💢</text>
  </g>
  <circle cx="60" cy="60" r="49" fill="none" stroke="#34d399" stroke-width="2" opacity="0.55"/>
</svg>
