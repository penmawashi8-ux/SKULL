<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="bg" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#2a0a18"/><stop offset="100%" stop-color="#080208"/>
    </radialGradient>
    <radialGradient id="skin" cx="32%" cy="28%" r="68%">
      <stop offset="0%" stop-color="#c8920a"/><stop offset="40%" stop-color="#7a560a"/><stop offset="100%" stop-color="#1e1505"/>
    </radialGradient>
    <radialGradient id="snout" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#a87008"/><stop offset="100%" stop-color="#4a3006"/>
    </radialGradient>
    <filter id="sh"><feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.55"/></filter>
    <clipPath id="cl"><circle cx="60" cy="60" r="50"/></clipPath>
  </defs>
  <circle cx="60" cy="60" r="58" fill="url(#bg)"/>
  <circle cx="60" cy="60" r="57" fill="none" stroke="#ec4899" stroke-width="5" opacity="0.12"/>
  <circle cx="60" cy="60" r="56" fill="none" stroke="#ec4899" stroke-width="1.2" opacity="0.75"/>
  <circle cx="60" cy="60" r="53" fill="none" stroke="#ec4899" stroke-width="0.5" opacity="0.25"/>
  <g clip-path="url(#cl)">
    <!-- Ears -->
    <ellipse cx="38" cy="40" rx="12" ry="15" fill="url(#skin)" transform="rotate(-18 38 40)" filter="url(#sh)"/>
    <ellipse cx="38" cy="40" rx="6.5" ry="9" fill="#5a2010" opacity="0.55" transform="rotate(-18 38 40)"/>
    <ellipse cx="82" cy="40" rx="12" ry="15" fill="url(#skin)" transform="rotate(18 82 40)" filter="url(#sh)"/>
    <ellipse cx="82" cy="40" rx="6.5" ry="9" fill="#5a2010" opacity="0.55" transform="rotate(18 82 40)"/>
    <!-- Head -->
    <circle cx="60" cy="63" r="29" fill="url(#skin)" filter="url(#sh)"/>
    <ellipse cx="50" cy="53" rx="9" ry="6" fill="white" opacity="0.08" transform="rotate(-30 50 53)"/>
    <!-- Eyes -->
    <circle cx="49" cy="57" r="5" fill="#120804"/>
    <circle cx="71" cy="57" r="5" fill="#120804"/>
    <circle cx="51" cy="55" r="1.8" fill="white" opacity="0.9"/>
    <circle cx="73" cy="55" r="1.8" fill="white" opacity="0.9"/>
    <!-- Snout -->
    <ellipse cx="60" cy="76" rx="18" ry="12" fill="url(#snout)"/>
    <ellipse cx="53" cy="76" rx="5" ry="4.5" fill="#120804" opacity="0.9" transform="rotate(-8 53 76)"/>
    <ellipse cx="67" cy="76" rx="5" ry="4.5" fill="#120804" opacity="0.9" transform="rotate(8 67 76)"/>
  </g>
  <circle cx="60" cy="60" r="50" fill="none" stroke="black" stroke-width="6" opacity="0.35"/>
</svg>
