# AdSenseに通っている類似サイトと、ボドゲ広場の構造を同じ方法で比べるための
# 一回限りの調査用ワークフロー。開発環境から外部サイトへ出られないため、
# Actionsのランナーから取得して、結果をジョブのログに出す。
#
# このファイルを変更してpushしたときだけ動く。調査が終わったら消してよい。
# （本番デプロイ後の確認のため再実行。最新の変更ぶんを確認）
name: site-compare

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/site-compare.yml'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - name: サイト構造を取得して比較
        run: |
          python3 - <<'PY'
          import re, html, json, time, urllib.request, urllib.error
          from collections import Counter

          UA = 'Mozilla/5.0 (compatible; site-structure-compare/1.0)'

          TARGETS = {
            # 比較対象のトランプスタジアムは初回の実行で測り終えたので、
            # ここでは取りにいかない（相手サイトへ無駄なアクセスをしない）。
            'ボドゲ広場': [
              'https://boardgamecat.com/',
              'https://boardgamecat.com/games/daifugo',
              'https://boardgamecat.com/blog/daifugo-rules.html',
              'https://boardgamecat.com/list/',
              'https://boardgamecat.com/list/hitori',
              'https://boardgamecat.com/list/party',
              'https://boardgamecat.com/about',
            ],
          }
          EXTRA = [
            'https://boardgamecat.com/robots.txt',
            'https://boardgamecat.com/sitemap.xml',
          ]
          # vercel.json で入れたキャッシュ指定が本番で効いているかの確認。
          # assets/ はビルドのたびにファイル名のハッシュが変わるので、
          # 決め打ちせずトップページのHTMLから拾う。
          def cache_check_urls():
              urls = [
                'https://boardgamecat.com/icons/daifugo.svg',
                'https://boardgamecat.com/favicon.ico',
                'https://boardgamecat.com/play/lib/p2p.js',
              ]
              _, _, top, _ = fetch('https://boardgamecat.com/')
              asset = re.search(r'/assets/[\w.-]+\.js', top or '')
              if asset:
                  urls.insert(1, 'https://boardgamecat.com' + asset.group(0))
              else:
                  print('   （トップページから assets/ のURLを拾えなかった）')
              return urls

          def fetch(url):
              req = urllib.request.Request(url, headers={'User-Agent': UA,
                                                         'Accept-Language': 'ja'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      raw = r.read()
                      enc = 'utf-8'
                      ct = r.headers.get('Content-Type', '')
                      m = re.search(r'charset=([\w-]+)', ct, re.I)
                      if m: enc = m.group(1)
                      body = raw.decode(enc, 'replace')
                      # metaのcharsetが実体と違うことがあるので、化けていたら拾い直す
                      m2 = re.search(r'charset=["\']?([\w-]+)', body[:2000], re.I)
                      if m2 and m2.group(1).lower() not in (enc.lower(), 'utf-8'):
                          body = raw.decode(m2.group(1), 'replace')
                      return r.status, dict(r.headers), body, len(raw)
              except urllib.error.HTTPError as e:
                  return e.code, dict(e.headers or {}), '', 0
              except Exception as e:
                  return 0, {}, f'ERROR: {e}', 0

          def visible_text(h):
              s = re.sub(r'<(script|style|noscript)[^>]*>.*?</\1>', ' ', h, flags=re.S | re.I)
              s = re.sub(r'<!--.*?-->', ' ', s, flags=re.S)
              s = re.sub(r'<[^>]+>', ' ', s)
              return re.sub(r'\s+', ' ', html.unescape(s)).strip()

          def tag(h, pat, n=1):
              m = re.search(pat, h, re.I | re.S)
              return html.unescape(m.group(n).strip())[:200] if m else '—'

          def report(url):
              st, hd, body, nbytes = fetch(url)
              print(f'\n── {url}')
              print(f'   HTTP {st}  {nbytes:,} bytes  {hd.get("Content-Type","?")}')
              for k in ('Last-Modified', 'Server', 'Cache-Control'):
                  if hd.get(k): print(f'   {k}: {hd[k]}')
              if st != 200 or not body:
                  print(f'   {body[:200]}')
                  return

              txt = visible_text(body)
              jp = re.sub(r'\s', '', txt)
              print(f'   本文(空白除く): {len(jp):,} 字')
              Q = '["\']'
              print('   title: ' + tag(body, r'<title[^>]*>(.*?)</title>'))
              print('   description: ' + tag(body, rf'<meta[^>]+name={Q}description{Q}[^>]+content={Q}(.*?){Q}'))
              print('   robots: ' + tag(body, rf'<meta[^>]+name={Q}robots{Q}[^>]+content={Q}(.*?){Q}'))
              print('   canonical: ' + tag(body, rf'<link[^>]+rel={Q}canonical{Q}[^>]+href={Q}(.*?){Q}'))

              hs = re.findall(r'<(h[1-3])[^>]*>(.*?)</\1>', body, re.I | re.S)
              print(f'   見出し {len(hs)}個:')
              for t, c in hs[:20]:
                  c = re.sub(r'\s+', ' ', html.unescape(re.sub(r'<[^>]+>', '', c))).strip()
                  if c: print(f'      <{t}> {c[:60]}')
              if len(hs) > 20: print(f'      …他 {len(hs)-20}個')

              ads = len(re.findall(r'adsbygoogle', body))
              pub = re.findall(r'(ca-pub-\d{4})\d+', body)
              slots = re.findall(r'data-ad-slot=["\'](\d+)', body)
              print(f'   AdSense: adsbygoogle {ads}箇所 / 広告枠 {len(slots)}個'
                    f' / pub {sorted(set(pub)) or "—"}')
              print(f'   計測タグ: ' + ', '.join(
                    n for n, p in [('gtag', r'gtag/js'), ('GA', r'google-analytics'),
                                   ('GTM', r'googletagmanager'), ('その他', r'analytics\.')]
                    if re.search(p, body)) or '   計測タグ: —')

              ifr = re.findall(r'<iframe[^>]+src=["\']([^"\']+)', body, re.I)
              print(f'   iframe {len(ifr)}個: ' + (', '.join(i[:60] for i in ifr[:5]) or '—'))

              ld = re.findall(r'<script[^>]+application/ld\+json[^>]*>(.*?)</script>', body, re.S | re.I)
              types = []
              for blob in ld:
                  try:
                      d = json.loads(blob)
                      for o in (d if isinstance(d, list) else d.get('@graph', [d])):
                          if isinstance(o, dict) and o.get('@type'): types.append(o['@type'])
                  except Exception: types.append('(parse失敗)')
              print(f'   構造化データ: {types or "—"}')

              hrefs = re.findall(r'<a[^>]+href=["\']([^"\'#]+)', body, re.I)
              internal = [h for h in hrefs if h.startswith('/') or 'playingcards.jp' in h or 'boardgamecat.com' in h]
              paths = []
              for h in internal:
                  p = re.sub(r'^https?://[^/]+', '', h)
                  paths.append(p.rsplit('/', 1)[0] + '/' if '/' in p.strip('/') else p)
              print(f'   内部リンク {len(internal)}本 / 行き先ディレクトリ: '
                    f'{dict(Counter(paths).most_common(8))}')
              print(f'   本文冒頭: {txt[:400]}')
              time.sleep(1.5)

          for group, urls in TARGETS.items():
              print(f'\n\n{"="*70}\n{group}\n{"="*70}')
              for u in urls:
                  report(u)

          print(f'\n\n{"="*70}\nrobots.txt / sitemap.xml\n{"="*70}')
          for u in EXTRA:
              st, hd, body, n = fetch(u)
              print(f'\n── {u}  HTTP {st}  {n:,} bytes')
              if st != 200:
                  print(f'   {body[:200]}')
                  continue
              if u.endswith('robots.txt'):
                  print('   ' + '\n   '.join(body.strip().splitlines()[:25]))
              else:
                  locs = re.findall(r'<loc>(.*?)</loc>', body)
                  smaps = re.findall(r'<sitemap>', body)
                  print(f'   URL {len(locs)}件 / サイトマップインデックス: {"はい" if smaps else "いいえ"}')
                  pref = Counter(re.sub(r'^https?://[^/]+', '', l).split('/')[1] or '(トップ)' for l in locs)
                  print(f'   ディレクトリ別: {dict(pref.most_common(15))}')
                  for l in locs[:8]: print(f'      {l}')
              time.sleep(1.5)

          print(f'\n\n{"="*70}\n要約（本番）\n{"="*70}')
          SUMMARY = [
            'https://boardgamecat.com/',
            'https://boardgamecat.com/games/daifugo',
            'https://boardgamecat.com/blog/daifugo-rules.html',
            'https://boardgamecat.com/list/',
          ]
          print(f'{"URL":36} {"本文":>7} {"内部リンク":>9}  構造化データ')
          for u in SUMMARY:
              st, _, body, _ = fetch(u)
              if st != 200:
                  print(f'{u.replace("https://boardgamecat.com", "") or "/":36} HTTP {st}')
                  continue
              jp = re.sub(r'\s', '', visible_text(body))
              links = len(re.findall(r'<a[^>]+href=["\'](/[^"\'#]*)', body))
              ts = []
              for blob in re.findall(r'application/ld\+json[^>]*>(.*?)</script>', body, re.S | re.I):
                  ts += re.findall(r'"@type"\s*:\s*"([^"]+)"', blob)
              keep = [t for t in dict.fromkeys(ts) if t not in ('ListItem', 'Question', 'Answer',
                                                               'Person', 'Organization', 'QuantitativeValue')]
              print(f'{u.replace("https://boardgamecat.com", "") or "/":36} {jp:>0}' if False else
                    f'{(u.replace("https://boardgamecat.com", "") or "/"):36} {len(jp):>6}字 {links:>8}本  {keep}')
              time.sleep(1)

          # DB接続が閉じない原因の切り分け。2秒おきに90秒ぶん見る。
          print(f'\n\n{"="*70}\nバーチャル競馬のDB接続（2秒おき）\n{"="*70}')
          H = 'https://gamekeiba-backend.onrender.com/health'
          rows = []
          for i in range(45):
              st, _, body, _ = fetch(H)
              try:
                  d = json.loads(body)
                  rows.append((i * 2, d.get('online'), d.get('phase'),
                               (d.get('db') or {}).get('open'),
                               (d.get('db') or {}).get('idle_sec')))
              except Exception:
                  rows.append((i * 2, None, None, None, None))
              time.sleep(2)
          print(f'{"秒":>4} {"接続":>4} {"フェーズ":<10} {"接続中":>6} {"無通信秒":>8}')
          for t, on, ph, op, idle in rows:
              print(f'{t:>4} {str(on):>4} {str(ph):<10} {str(op):>6} {str(idle):>8}')
          idles = [r[4] for r in rows if isinstance(r[4], int)]
          if idles:
              print(f'\n無通信秒の最大 {max(idles)} / 最小 {min(idles)}')
              print('判定: ' + ('60秒に届かないので接続は閉じない'
                               if max(idles) < 60 else '閉じられている'))

          # バーチャル競馬のバックエンド（Render）が復旧しているかの確認。
          # Renderの無料枠を超えて停止していたので、動いているかを見る。
          print(f'\n\n{"="*70}\nバーチャル競馬の状態\n{"="*70}')
          st, _, cfg, _ = fetch('https://gamekeiba.boardgamecat.com/api/config')
          print(f'フロント(/api/config): HTTP {st}  {cfg[:120]}')
          ws = ''
          try:
              ws = json.loads(cfg).get('wsUrl', '')
          except Exception:
              pass
          if ws:
              health = ws.replace('wss://', 'https://').replace('ws://', 'http://')
              health = health.split('/ws')[0] + '/health'
              hst, _, hbody, _ = fetch(health)
              print(f'バックエンド({health}): HTTP {hst}  {hbody[:160]}')
              print('判定: ' + ('動いている' if hst == 200 else
                               '止まっている（Renderが停止中か起動待ち）'))
          else:
              print('wsUrl が取れないので、バックエンドのURLを特定できなかった')

          print(f'\n\n{"="*70}\nCache-Control の確認\n{"="*70}')
          for u in cache_check_urls():
              st, hd, _, n = fetch(u)
              print(f'{u.replace("https://boardgamecat.com", ""):40} HTTP {st}  '
                    f'{hd.get("Cache-Control", "(指定なし)")}')
              time.sleep(1)
          PY
