# 「別タブで大きく開く」を押したときにセッション（プレイヤーの識別子）が
# 変わってしまうかを、本番サイトに対して実際のブラウザで確かめる。
#
# iframe の中で動いているゲームと、サブドメインを直接開いたゲームとで
# 保存領域が共有されるかはブラウザによって違う。iPhone を想定して
# WebKit でも確認する。
#
# このファイルを変更して push したときだけ動く。
name: session-check

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/session-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 出力は潰さない（前回ここで止まったとき原因が見えなかった）。
      # --with-deps の apt が長いので、ブラウザ本体だけ入れて様子を見る。
      - name: Playwright を入れる
        timeout-minutes: 12
        run: |
          set -x
          npm init -y
          npm i -D @playwright/test@1.56.1
          npx playwright install-deps chromium webkit
          npx playwright install chromium webkit
          echo "準備完了"

      - name: セッションが引き継がれるか確かめる
        timeout-minutes: 10
        run: |
          cat > check.mjs <<'JS'
          import { chromium, webkit } from '@playwright/test'

          const SITE = 'https://gamekeiba.boardgamecat.com'
          const KEY  = 'keiba_session_id'

          // バーチャル競馬は名前を入れて「参加する」を押したときに
          // はじめて localStorage へ識別子を書く。そこまで進めないと
          // 何も入っていないので、実際に参加するところまでやる。
          async function join(target, label) {
            const input = target.getByPlaceholder('プレイヤー名')
            if (await input.count()) {
              await input.fill('セッション確認')
              const btn = target.getByRole('button', { name: /参加する/ })
              if (await btn.count()) await btn.click()
              return 'フォームに入力して参加'
            }
            return '参加フォームが出ていない（すでに参加済みか、読み込み中）'
          }

          const read = () => {
            try { return localStorage.getItem('keiba_session_id') } catch (e) { return 'ERR:' + e.name }
          }

          async function runWith(engine, label) {
            console.log(`\n${'='.repeat(64)}\n${label}\n${'='.repeat(64)}`)
            const browser = await engine.launch()
            const ctx = await browser.newContext({ viewport: { width: 390, height: 844 }, locale: 'ja-JP' })

            // 1) ボドゲ広場のゲームページ（iframeの中で遊ぶ）
            const page = await ctx.newPage()
            await page.goto('https://boardgamecat.com/games/keiba', { waitUntil: 'load', timeout: 60000 })
            await page.waitForTimeout(8000)
            const frame = page.frames().find(f => f.url().startsWith(SITE))
            if (!frame) { console.log('  iframeが見つからない'); await browser.close(); return }
            console.log('  iframe内: ' + await join(frame, 'iframe'))
            await page.waitForTimeout(8000)
            const inIframe = await frame.evaluate(read)
            console.log(`  iframe内の ${KEY}: ${inIframe}`)

            // 2) 「別タブで大きく開く」と同じこと
            const tab = await ctx.newPage()
            await tab.goto(SITE, { waitUntil: 'load', timeout: 60000 })
            await tab.waitForTimeout(6000)
            const beforeJoin = await tab.evaluate(read)
            console.log(`  別タブを開いた直後の ${KEY}: ${beforeJoin}`)

            console.log('\n  → ' + (
              beforeJoin && beforeJoin === inIframe
                ? '✓ 同じセッションが引き継がれている'
                : beforeJoin == null
                  ? '✗ 別タブでは識別子が無い（＝別人あつかい・所持金がリセットされて見える）'
                  : '✗ 別の識別子になっている'))

            await browser.close()
          }

          await runWith(chromium, 'Chromium（Android / PCのChrome相当）')
          await runWith(webkit, 'WebKit（iPhoneのSafari相当）')
          JS
          node check.mjs
