# 「別タブで大きく開く」を押したときにセッション（プレイヤーの識別子）が
# 変わってしまうかを、本番サイトに対して実際のブラウザで確かめる。
#
# iframe の中で動いているゲームと、サブドメインを直接開いたゲームとで
# 保存領域が共有されるかはブラウザによって違う。iPhone を想定して
# WebKit でも確認する。
#
# このファイルを変更して push したときだけ動く。
name: session-check

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/session-check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 出力は潰さない（前回ここで止まったとき原因が見えなかった）。
      # --with-deps の apt が長いので、ブラウザ本体だけ入れて様子を見る。
      - name: Playwright を入れる
        timeout-minutes: 12
        run: |
          set -x
          npm init -y
          npm i -D @playwright/test@1.56.1
          npx playwright install-deps chromium webkit
          npx playwright install chromium webkit
          echo "準備完了"

      - name: セッションが引き継がれるか確かめる
        run: |
          cat > check.mjs <<'JS'
          import { chromium, webkit } from '@playwright/test'

          // ゲームごとの「プレイヤーの識別子」の保存場所
          const GAMES = [
            { id: 'keiba',    name: 'バーチャル競馬', site: 'https://gamekeiba.boardgamecat.com',
              keys: ['keiba_session_id'] },
            { id: 'pig-tail', name: 'ぶたのしっぽ',   site: 'https://buta.boardgamecat.com',
              keys: ['online_player_id'] },
            { id: 'page-one', name: 'ページワン',     site: 'https://pageone.boardgamecat.com',
              keys: ['pageone_my_player_id'] },
          ]

          // iframe / ページから、localStorage と sessionStorage の該当キーを読む。
          // frame.evaluate に関数と引数を渡す形にする（文字列組み立ては壊れやすい）
          const reader = ({ keys }) => {
            const out = {}
            for (const k of keys) {
              try { out['local:' + k] = localStorage.getItem(k) } catch { out['local:' + k] = 'ERR' }
              try { out['session:' + k] = sessionStorage.getItem(k) } catch { out['session:' + k] = 'ERR' }
            }
            return out
          }

          async function runWith(engine, label) {
            console.log(`\n${'='.repeat(64)}\n${label}\n${'='.repeat(64)}`)
            const browser = await engine.launch()
            const ctx = await browser.newContext({ viewport: { width: 390, height: 844 }, locale: 'ja-JP' })

            for (const g of GAMES) {
              const page = await ctx.newPage()
              let inIframe = null, inTab = null
              try {
                // 1) ボドゲ広場のゲームページ（iframeの中でゲームが動く）
                await page.goto(`https://boardgamecat.com/games/${g.id}`, { waitUntil: 'load', timeout: 60000 })
                await page.waitForTimeout(9000)
                const frame = page.frames().find(f => f.url().startsWith(g.site))
                inIframe = frame ? await frame.evaluate(reader, { keys: g.keys }).catch(e => 'EVAL_ERR:' + e.message) : '(iframeが見つからない)'

                // 2) 「別タブで大きく開く」と同じ遷移（同じブラウザの別タブ）
                const tab = await ctx.newPage()
                await tab.goto(g.site, { waitUntil: 'load', timeout: 60000 })
                await tab.waitForTimeout(9000)
                inTab = await tab.evaluate(reader, { keys: g.keys }).catch(e => 'EVAL_ERR:' + e.message)
                await tab.close()
              } catch (e) {
                console.log(`  ${g.name}: 取得に失敗 ${e.message.slice(0, 120)}`)
                await page.close(); continue
              }
              await page.close()

              console.log(`\n── ${g.name} (${g.id})`)
              console.log(`   iframe内 : ${JSON.stringify(inIframe)}`)
              console.log(`   別タブ   : ${JSON.stringify(inTab)}`)
              for (const k of g.keys) {
                for (const area of ['local', 'session']) {
                  const a = inIframe?.[`${area}:${k}`], b = inTab?.[`${area}:${k}`]
                  if (a == null && b == null) continue
                  const same = a != null && a === b
                  console.log(`   ${area}:${k} → ${same ? '✓ 同じセッション' : '✗ 別セッションになる'}`)
                }
              }
            }
            await browser.close()
          }

          await runWith(chromium, 'Chromium（Android / PCのChrome相当）')
          await runWith(webkit, 'WebKit（iPhoneのSafari相当）')
          JS
          node check.mjs
